<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Vũ Ngọc Phiêu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="avatar.jpg">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>

<body>

<canvas id="particles"></canvas>
<div class="cursor-glow" id="glow"></div>

<div class="card" id="card">

  <div class="avatar">
    <img src="./media/avatar.jpg" alt="Vũ Ngọc Phiêu">
  </div>

  <h1 id="typing"></h1>
  <span class="role">Aspiring Fullstack Developer • AI • Creative Tech</span>

  <p id="desc">
    Xây dựng sản phẩm có chiều sâu.<br>
    Code không chỉ chạy — mà phải có linh hồn.
  </p>

  <!-- AI MINI CHAT -->
  <div class="chatbox">
    <div class="chatlog" id="chatlog">
      <div class="bot">👁️ Xin chào, bạn muốn biết gì về tôi?</div>
    </div>
    <input id="chatInput" placeholder="Hỏi về skills, dự án, liên hệ..." />
  </div>
  <iframe
    src="https://open.spotify.com/embed/playlist/37i9dQZF1DX9Z3vMB2b8im"
    height="80"
    allow="encrypted-media">
  </iframe>

  <div class="social">
    <a href="https://github.com/vungocphieu" target="_blank"><i class="fab fa-github"></i></a>
    <a href="https://linkedin.com/in/vungocphieu21" target="_blank"><i class="fab fa-linkedin"></i></a>
    <a href="https://facebook.com/ngocphieu2106" target="_blank"><i class="fab fa-facebook"></i></a>
    <a href="https://tiktok.com/@lieucute21" target="_blank"><i class="fab fa-tiktok"></i></a>
  </div>

  <div class="actions">
    <button id="musicBtn"><i class="fa fa-music"></i></button>
    <button id="themeBtn"><i class="fa fa-moon"></i></button>
  </div>

</div>

<div class="fps" id="fps">FPS: 0</div>

<audio id="bgMusic" loop src="./media/music.mp3"></audio>
<audio id="hoverSound" src="./media/hover.mp3"></audio>
<audio id="clickSound" src="./media/click.mp3"></audio>

</body>
</html>
